<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" width="1000" height="525" role="img"><title>Recoil delivery and recovery overlap</title><rect width="1000" height="525" rx="16" fill="#f3f6fa"/><g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="43" font-size="27" fill="#142b42" font-weight="700">Recoil delivery and recovery overlap</text>
<text x="30" y="75" font-size="17" fill="#32465b" font-weight="400">Illustration: equal kick amount, one shot every 100 ms (600 RPM).</text>
<text x="30" y="138" font-size="19" fill="#142b42" font-weight="700">Base</text>
<rect x="300" y="115" width="600" height="24" rx="5" fill="#e2e9f0"/>
<rect x="300" y="115" width="150" height="24" rx="5" fill="#60768a"/>
<text x="460" y="134" font-size="17" fill="#32465b" font-weight="400">25 ms</text>
<rect x="300" y="152" width="600" height="12" rx="5" fill="#78a99f"/>
<text x="30" y="167" font-size="17" fill="#32465b" font-weight="400">Recovery factor ×1.0</text>
<text x="30" y="237" font-size="19" fill="#142b42" font-weight="700">Ordinary Smooth</text>
<rect x="300" y="214" width="600" height="24" rx="5" fill="#e2e9f0"/>
<rect x="300" y="214" width="300" height="24" rx="5" fill="#bc6032"/>
<text x="610" y="233" font-size="17" fill="#32465b" font-weight="400">50 ms</text>
<rect x="300" y="251" width="600" height="12" rx="5" fill="#78a99f"/>
<text x="30" y="266" font-size="17" fill="#32465b" font-weight="400">Recovery factor ×1.2</text>
<text x="30" y="336" font-size="19" fill="#142b42" font-weight="700">Mapped Smooth Bolt</text>
<rect x="300" y="313" width="600" height="24" rx="5" fill="#e2e9f0"/>
<rect x="300" y="313" width="400.002" height="24" rx="5" fill="#367bbb"/>
<text x="710.002" y="332" font-size="17" fill="#32465b" font-weight="400">66.667 ms</text>
<rect x="300" y="350" width="600" height="12" rx="5" fill="#78a99f"/>
<text x="30" y="365" font-size="17" fill="#32465b" font-weight="400">Recovery factor ×1.728</text>
<text x="292" y="429" font-size="16" fill="#32465b" font-weight="400">0</text>
<text x="442" y="429" font-size="16" fill="#32465b" font-weight="400">25</text>
<text x="592" y="429" font-size="16" fill="#32465b" font-weight="400">50</text>
<text x="742" y="429" font-size="16" fill="#32465b" font-weight="400">75</text>
<text x="892" y="429" font-size="16" fill="#32465b" font-weight="400">100</text>
<text x="300" y="460" font-size="18" fill="#32465b" font-weight="400">Time since shot (ms)</text>
<text x="30" y="493" font-size="19" fill="#32465b" font-weight="400">Colored bars: delivery window. Green: recovery stays active, including during delivery.</text>
</g></svg>
