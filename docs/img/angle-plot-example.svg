<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" style="max-width:100%;height:auto" role="img"><title>Angle Plot: read a direction change</title><desc>Illustrative six-shot pattern in degrees; not weapon data.</desc><rect width="1000" height="600" rx="16" fill="#f3f6fa"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="43" font-size="28" fill="#142b42" font-weight="700">Angle Plot: read a direction change</text><text x="30" y="76" font-size="18" fill="#32465b" font-weight="400">Illustrative six-shot pattern • degrees on both axes • no target distance</text><line x1="95" y1="150" x2="95" y2="495" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray=""/><text x="87" y="520" font-size="16" fill="#32465b" font-weight="400">-1</text><line x1="240" y1="150" x2="240" y2="495" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray=""/><text x="232" y="520" font-size="16" fill="#32465b" font-weight="400">0</text><line x1="385" y1="150" x2="385" y2="495" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray=""/><text x="377" y="520" font-size="16" fill="#32465b" font-weight="400">1</text><line x1="530" y1="150" x2="530" y2="495" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray=""/><text x="522" y="520" font-size="16" fill="#32465b" font-weight="400">2</text><line x1="95" y1="460" x2="530" y2="460" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray=""/><text x="62" y="466" font-size="16" fill="#32465b" font-weight="400">0</text><line x1="95" y1="315" x2="530" y2="315" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray=""/><text x="62" y="321" font-size="16" fill="#32465b" font-weight="400">1</text><line x1="95" y1="170" x2="530" y2="170" stroke="#d4dfe9" stroke-width="1.5" stroke-dasharray=""/><text x="62" y="176" font-size="16" fill="#32465b" font-weight="400">2</text><text x="95" y="130" font-size="16" fill="#32465b" font-weight="400">Vertical offset (°)</text><text x="215" y="552" font-size="16" fill="#32465b" font-weight="400">Horizontal offset (°)</text><line x1="240" y1="150" x2="240" y2="495" stroke="#62758a" stroke-width="2" stroke-dasharray=""/><line x1="95" y1="460" x2="530" y2="460" stroke="#62758a" stroke-width="2" stroke-dasharray=""/><polyline points="240,460 247.25,416.5 255.95,373 266.1,329.5 276.25,286 286.4,242.5" fill="none" stroke="#367bbb" stroke-width="3"/><circle cx="247.25" cy="416.5" r="17" fill="#367bbb" fill-opacity=".06" stroke="#367bbb" stroke-width="1.5"/><circle cx="266.1" cy="329.5" r="27" fill="#367bbb" fill-opacity=".06" stroke="#367bbb" stroke-width="1.5"/><circle cx="286.4" cy="242.5" r="37" fill="#367bbb" fill-opacity=".06" stroke="#367bbb" stroke-width="1.5"/><circle cx="240" cy="460" r="5" fill="#bc6032"/><text x="250" y="454" font-size="15" fill="#bc6032" font-weight="700">1</text><circle cx="257.4" cy="409.25" r="5" fill="#bc6032"/><text x="267.4" y="403.25" font-size="15" fill="#bc6032" font-weight="700">2</text><circle cx="228.4" cy="370.1" r="5" fill="#bc6032"/><text x="238.4" y="364.1" font-size="15" fill="#bc6032" font-weight="700">3</text><circle cx="279.15" cy="322.25" r="5" fill="#bc6032"/><text x="289.15" y="316.25" font-size="15" fill="#bc6032" font-weight="700">4</text><circle cx="266.1" cy="280.2" r="5" fill="#bc6032"/><text x="276.1" y="274.2" font-size="15" fill="#bc6032" font-weight="700">5</text><circle cx="305.25" cy="235.25" r="5" fill="#bc6032"/><text x="315.25" y="229.25" font-size="15" fill="#bc6032" font-weight="700">6</text><text x="600" y="169" font-size="21" fill="#142b42" font-weight="700">Dots: sampled shot directions</text><text x="600" y="201" font-size="18" fill="#32465b" font-weight="400">Numbers show shot order.</text><line x1="600" y1="240" x2="640" y2="240" stroke="#367bbb" stroke-width="3" stroke-dasharray=""/><text x="652" y="246" font-size="20" fill="#142b42" font-weight="700">Recoil-only path</text><text x="600" y="279" font-size="18" fill="#32465b" font-weight="400">Aim movement before random spread.</text><circle cx="618" cy="323" r="16" fill="none" stroke="#367bbb"/><text x="652" y="330" font-size="20" fill="#142b42" font-weight="700">Spread envelope</text><text x="600" y="364" font-size="18" fill="#32465b" font-weight="400">A shot can land within its circle.</text><text x="600" y="394" font-size="18" fill="#32465b" font-weight="400">The circle is not a hit probability.</text><text x="600" y="456" font-size="20" fill="#142b42" font-weight="700">(0, 0) = starting aim direction</text><text x="600" y="491" font-size="18" fill="#32465b" font-weight="400">Distance does not change these angles.</text><text x="30" y="585" font-size="17" fill="#32465b" font-weight="400">Schematic only. The same six directions are projected onto the targets below.</text></g></svg>