<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img"><title>Recoil tiers change two different properties</title><rect width="1000" height="550" rx="16" fill="#f3f6fa"/><g font-family="Arial, Helvetica, sans-serif">
<text x="30" y="43" font-size="27" fill="#142b42" font-weight="700">Recoil tiers change two different properties</text>
<text x="30" y="75" font-size="17" fill="#32465b" font-weight="400">M4A1 example: attachment tier sums relative to the same base loadout.</text>
<text x="30" y="120" font-size="19" fill="#97502d" font-weight="700">AMOUNT: KICK LENGTH</text>
<text x="520" y="120" font-size="19" fill="#286aa5" font-weight="700">VARIATION: ANGULAR RANGE</text>
<text x="30" y="154" font-size="18" fill="#32465b" font-weight="400">Multiplier per tier: 0.9425</text>
<text x="520" y="154" font-size="18" fill="#32465b" font-weight="400">Multiplier per tier: 0.921205</text>
<text x="30" y="211" font-size="18" fill="#32465b" font-weight="400">+0</text>
<rect x="78" y="188" width="270.0" height="29" rx="5" fill="#bc6032"/>
<text x="364" y="211" font-size="19" fill="#32465b" font-weight="400">100.0%</text>
<text x="520" y="211" font-size="18" fill="#32465b" font-weight="400">+0</text>
<rect x="568" y="188" width="270.0" height="29" rx="5" fill="#367bbb"/>
<text x="854" y="211" font-size="19" fill="#32465b" font-weight="400">100.0%</text>
<text x="30" y="270" font-size="18" fill="#32465b" font-weight="400">+1</text>
<rect x="78" y="247" width="254.475" height="29" rx="5" fill="#bc6032"/>
<text x="364" y="270" font-size="19" fill="#32465b" font-weight="400">94.2%</text>
<text x="520" y="270" font-size="18" fill="#32465b" font-weight="400">+1</text>
<rect x="568" y="247" width="248.72535000000002" height="29" rx="5" fill="#367bbb"/>
<text x="854" y="270" font-size="19" fill="#32465b" font-weight="400">92.1%</text>
<text x="30" y="329" font-size="18" fill="#32465b" font-weight="400">+2</text>
<rect x="78" y="306" width="239.84268749999998" height="29" rx="5" fill="#bc6032"/>
<text x="364" y="329" font-size="19" fill="#32465b" font-weight="400">88.8%</text>
<text x="520" y="329" font-size="18" fill="#32465b" font-weight="400">+2</text>
<rect x="568" y="306" width="229.12703604675002" height="29" rx="5" fill="#367bbb"/>
<text x="854" y="329" font-size="19" fill="#32465b" font-weight="400">84.9%</text>
<text x="30" y="388" font-size="18" fill="#32465b" font-weight="400">+3</text>
<rect x="78" y="365" width="226.05173296875" height="29" rx="5" fill="#bc6032"/>
<text x="364" y="388" font-size="19" fill="#32465b" font-weight="400">83.7%</text>
<text x="520" y="388" font-size="18" fill="#32465b" font-weight="400">+3</text>
<rect x="568" y="365" width="211.07297124144637" height="29" rx="5" fill="#367bbb"/>
<text x="854" y="388" font-size="19" fill="#32465b" font-weight="400">78.2%</text>
<text x="30" y="444" font-size="20" fill="#32465b" font-weight="400">Amount and variation have separate tier sums. Each uses base × multiplier ^ tier sum.</text>
<text x="30" y="482" font-size="19" fill="#32465b" font-weight="400">A smaller amount shortens the kick; a smaller variation narrows its possible directions.</text>
<text x="30" y="514" font-size="18" fill="#32465b" font-weight="400">These percentages describe kick inputs, not final spray height or width.</text>
</g></svg>
