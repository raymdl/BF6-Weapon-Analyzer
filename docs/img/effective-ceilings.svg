<text x="520" y="935" font-size="19" fill="#367bbb" font-weight="700">Heavy barrel: about 0.63 degrees</text>
<text x="30" y="971" font-size="18" fill="#32465b" font-weight="400">Growth per shot balances recovery between shots. The hard maximum is 7 degrees.</text>
<text x="30" y="999" font-size="18" fill="#32465b" font-weight="400">Both curves settle below that bound; Heavy preserves the same 0.05-degree floor.</text>
<text x="30" y="1056" font-size="19" fill="#142b42" font-weight="700">These are sustained pre-shot levels, not a universal hard cap or the within-shot peak.</text>
<text x="30" y="1086" font-size="19" fill="#32465b" font-weight="400">Rate of fire, loadout, control, and firing gaps can change the balance.</text>
