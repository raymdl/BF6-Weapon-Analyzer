<text x="520" y="481" font-size="19" fill="#367bbb" font-weight="700">Lightened Suppressor: about 5.50 degrees</text>
<text x="30" y="517" font-size="18" fill="#32465b" font-weight="400">Mean of 128 seeds. Individual recoil paths fluctuate around the sustained level.</text>
<text x="30" y="545" font-size="20" fill="#32465b" font-weight="400">As displacement grows, recovery removes more of each new kick.</text>
