<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" style="max-width:100%;height:auto" role="img"><title>Recoil and spread approach sustained levels</title><desc>Current simulator output across 40 uninterrupted shots. M4A1 mean pre-shot recoil approaches a level, lower with Lightened. AK4D spread approaches a balance below its hard maximum, lower with Heavy.</desc><rect width="1000" height="1110" rx="16" fill="#f3f6fa"/><g font-family="Arial, Helvetica, sans-serif">
