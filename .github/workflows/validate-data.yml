name: Validate Data

on:
  # Documentation-only pushes (research notes, topic pages, Python research
  # tooling) cannot affect the validators or tests. reference-data/ is not
  # ignored because tests read it.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'scripts/*.py']
  push:
    paths-ignore: ['docs/**', '**/*.md', 'scripts/*.py']

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate live data
        run: node scripts/validate-data.mjs
      - name: Validate published surface
        run: node scripts/validate-ship-surface.mjs
      - name: Run product tests
        run: node scripts/test.mjs
